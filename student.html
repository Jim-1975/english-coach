                html += `</div>`;
            });

            body.innerHTML = html;
        }

        function resetProblems() {
            if (!confirm("重新提取将清空你刚刚写好的反思，确定吗？")) return;
            localStorage.removeItem(`coach_problems_${studentName}`);
            localStorage.removeItem(getReflectionKey());
            renderProblemsTab();
        }

        function submitReflection(problem) {
            const input = document.getElementById(`reflection-input-${problem}`);
            if (!input || !input.value.trim()) return alert("写点什么吧，哪怕一句“我以后一定注意”！");
            
            saveReflection(problem, input.value);
        }

        function editReflection(problem) {
            const reflections = getSavedReflections();
            const currentText = reflections[problem] || "";
            const newText = prompt("修改你的反思：", currentText);
            if (newText !== null) {
                saveReflection(problem, newText);
            }
        }

        function extractScore(feedback) {
            if (!feedback) return null;
            const match = feedback.match(/(\d+(?:\.\d+)?)\s*\/\s*(15|20)/);
            if (match) return { score: parseFloat(match[1]), fullScore: parseInt(match[2]) };
            return null;
        }

        function renderRecordsTab() {
            const body = document.getElementById('history-body');
            body.innerHTML = ''; 

            const sortedRecords = [...currentHistoryRecords].reverse();
            const writingRecords = sortedRecords.filter(r => (r.mode || 'writing') === 'writing');
            const translationRecords = sortedRecords.filter(r => r.mode === 'translation');

            let chartHtml = '';
            if (writingRecords.length > 0) {
                chartHtml += `
                    <div class="chart-section">
                        <div class="chart-title"><span>写作成绩趋势</span><span style="font-size:12px;color:#999;">点击圆点看详情</span></div>
                        <div class="canvas-wrapper"><canvas id="chart-writing" class="chart-canvas"></canvas></div>
                    </div>
                `;
            }
            if (translationRecords.length > 0) {
                chartHtml += `
                    <div class="chart-section">
                        <div class="chart-title"><span>翻译成绩趋势</span><span style="font-size:12px;color:#999;">点击圆点看详情</span></div>
                        <div class="canvas-wrapper"><canvas id="chart-translation" class="chart-canvas"></canvas></div>
                    </div>
                `;
            }

            let listHtml = '<div class="history-list">';
            currentHistoryRecords.forEach((rec) => {
                const modeStr = rec.mode === 'translation' ? '翻译' : '写作';
                const dateStr = new Date(rec.created_at).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const safeRec = escapeHtmlSafe(JSON.stringify(rec));
                listHtml += `
                    <div class="past-record-card" onclick='openSingleRecord(JSON.parse(this.dataset.rec))' data-rec="${safeRec}">
                        <div class="past-record-header">
                            <span class="past-record-topic">${escapeHtmlSafe(cleanTopic(rec.topic))}</span>
                            <span class="past-record-meta">${dateStr}</span>
                        </div>
                        <div class="rec-tag-row">${buildRecordTags(rec, modeStr)}</div>
                        <div class="past-record-preview">${escapeHtmlSafe(rec.original)}</div>
                    </div>
                `;
            });
            listHtml += '</div>';

            body.innerHTML = chartHtml + listHtml;

            if (writingRecords.length > 0) {
                setTimeout(() => drawStudentChart('chart-writing', writingRecords), 50);
            }
            if (translationRecords.length > 0) {
                setTimeout(() => drawStudentChart('chart-translation', translationRecords), 50);
            }
        }

        function drawStudentChart(canvasId, records) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if(rect.width === 0) return;
            
            canvas.width = rect.width * dpr; 
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            const w = rect.width, h = rect.height, padding = 30;
            
            const dataPoints = [];
            records.forEach(r => {
                const s = extractScore(r.feedback);
                if (s) dataPoints.push({ percent: (s.score / s.fullScore) * 100, rawRecord: r });
            });
            
            if (dataPoints.length < 2) {
                ctx.fillStyle = '#8e8e93'; ctx.font = '13px -apple-system'; ctx.textAlign = 'center';
                ctx.fillText('练习次数不足，无法生成趋势图', w/2, h/2);
                return;
            }

            const xStep = (w - padding * 2) / (dataPoints.length - 1);
            
            ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
            for(let i=0; i<=4; i++) {
                const y = padding + (h - padding*2) * (i/4);
                ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(w - padding, y); ctx.stroke();
            }

            ctx.beginPath();
            const getY = (p) => h - padding - (p / 100) * (h - padding*2);
            
            ctx.moveTo(padding, getY(dataPoints[0].percent));
            dataPoints.forEach((pt, i) => {
                if (i === 0) return;
                ctx.lineTo(padding + i * xStep, getY(pt.percent));
            });

            ctx.strokeStyle = '#34c759'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();

            ctx.lineTo(w - padding, h - padding); ctx.lineTo(padding, h - padding); ctx.closePath();
            const gradient = ctx.createLinearGradient(0, padding, 0, h - padding);
            gradient.addColorStop(0, 'rgba(52, 199, 89, 0.2)');
            gradient.addColorStop(1, 'rgba(52, 199, 89, 0)');
            ctx.fillStyle = gradient; ctx.fill();

            const pointsCoords = [];
            dataPoints.forEach((pt, i) => {
                const x = padding + i * xStep;
                const y = getY(pt.percent);
                pointsCoords.push({ x, y, pt });
                
                ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            });

            canvas.onclick = function(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const canvasRect = canvas.getBoundingClientRect();
                const mouseX = clientX - canvasRect.left;
                const mouseY = clientY - canvasRect.top;

                let closest = null;
                let minDist = 40; 

                pointsCoords.forEach(coord => {
                    const dist = Math.sqrt((mouseX - coord.x)**2 + (mouseY - coord.y)**2);
                    if (dist < minDist) { minDist = dist; closest = coord; }
                });

                if (closest) {
                    openSingleRecord(closest.pt.rawRecord);
                }
            };
        }

        // ---------- 从完整的批改报告中截取第一段（“翻译分项评分与总评”/“多维评分与总评”），后面的错漏精批、升格、建议全部丢弃 ----------
        function extractScoreSummary(feedback) {
            if (!feedback) return '';
            let text = String(feedback)
                .replace(/\u0000/g, '')
                .replace(/\r\n?/g, '\n')
                .replace(/```[a-zA-Z]*\s*/g, '')
                .trim();

            // 1. 优先找带“评分与总评”的标题
            let start = text.search(/(?:^|\n)\s*#{1,6}\s*[^\n]*评分[^\n]*总评[^\n]*(?=\n|$)/);
            let useHeading = start >= 0;

            // 2. 兜底：任何一个 Markdown 标题（排除 ### 错漏精批 这类）
            if (start < 0) {
                start = text.search(/(?:^|\n)\s*#{1,6}\s*(?:多维评分|翻译分项评分|评分总览|评分矩阵)[^\n]*/);
            }
            // 3. 再兜底：直接从“- **信息完整性**”这类分项行开始
            if (start < 0) {
                start = text.search(/(?:^|\n)\s*[-*•]\s*(?:\*\*)?\s*(?:信息完整性|语义准确性|语言规范性|内容切题度|结构逻辑性|语言准确性|地道性|内容阐述|语言运用|篇章组织|内容完成度|语言资源|组织结构)/);
                useHeading = false;
            }
            if (start < 0) return text; // 都找不到就整段展示，不吞内容

            let body = useHeading ? text.slice(start).replace(/^\s*/, '') : text.slice(start).replace(/^\s*/, '');

            // 4. 截断：遇到分隔线或下一段 ### 标题就停
            let end = body.search(/\n\s*(?:-{3,}|\*{3,}|_{3,})\s*(?:\n|$)/);
            if (end < 0) end = body.search(/\n\s*#{1,6}\s+/);
            if (end < 0) end = body.search(/\n\s*(?:\*\*)?\s*总分\s*[：:]/);
            if (end >= 0) {
                let keepTotal = false;
                if (body.slice(end).trim().startsWith('**总分') || body.slice(end).trim().startsWith('总分')) keepTotal = true;
                if (keepTotal) return body.trim();
                body = body.slice(0, end);
            }

            // 5. 兜底：万一没有分隔线，就在“错漏精批/句型与词汇升级/提分建议”关键字处切断
            const cutWords = ['\n### 错漏精批', '\n### 句型', '\n### 提分建议', '\n## 错漏精批', '\n## 句型', '\n## 提分建议', '\n**错漏精批'];
            cutWords.forEach(w => {
                const i = body.indexOf(w);
                if (i >= 0) body = body.slice(0, i);
            });

            return body.trim();
        }

        function openSingleRecord(rec) {
            if (!rec) return;
            
            const modeStr = rec.mode === 'translation' ? '翻译' : '写作';
            const dateStr = new Date(rec.created_at).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            
            document.getElementById('single-record-title').innerText = `${dateStr} · ${modeStr}练习`;
            
            const summaryMd = extractScoreSummary(rec.feedback);
            const summaryHtml = summaryMd ? marked.parse(summaryMd) : '<p style="color:#8e8e93;">这份报告没有找到评分信息。</p>';
            
            document.getElementById('single-record-content').innerHTML = `
                <div class="rec-tag-row" style="margin-bottom: 18px;">${buildRecordTags(rec, modeStr)}</div>
                <div style="margin-bottom: 25px;">
                    <div style="font-size: 14px; font-weight: 800; color: #888; margin-bottom: 8px;">题目</div>
                    <div style="font-size: 17px; font-weight: 800; color: #000; line-height: 1.5;">${escapeHtmlSafe(cleanTopic(rec.topic))}</div>
                </div>
                <div style="margin-bottom: 25px;">
                    <div style="font-size: 14px; font-weight: 800; color: #888; margin-bottom: 8px;">你的原文</div>
                    <div style="font-size: 16px; color: #333; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 12px;">${escapeHtmlSafe(rec.original)}</div>
                </div>
                <div>
                    <div style="font-size: 14px; font-weight: 800; color: #888; margin-bottom: 8px;">评分与总评</div>
                    <div class="analysis-box show" style="margin-top: 0; background: #fff; font-size: 15px; line-height: 1.8;">${summaryHtml}</div>
                </div>
            `;
            
            document.getElementById('single-record-modal').style.display = 'flex';
        }

        function escapeHtmlSafe(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ---------- 历史记录标签：类型 + 难度 + 来源 ----------
        function cleanTopic(topic) {
            return String(topic == null ? '' : topic).replace(/\n?\s*ECLEVEL:[a-z0-9]+\s*$/i, '').trim();
        }

        function detectExamLevel(rec) {
            const topic = String(rec.topic || '');
            const mark = topic.match(/ECLEVEL:(cet4|cet6|tem4|tem8)/i);
            if (mark) return mark[1].toLowerCase();
            const feedback = String(rec.feedback || '');
            if (/专八|TEM-?8|TEM 8/i.test(feedback)) return 'tem8';
            if (/专四|TEM-?4|TEM 4/i.test(feedback)) return 'tem4';
            if (/六级|CET-?6|CET 6/i.test(feedback)) return 'cet6';
            if (/四级|CET-?4|CET 4/i.test(feedback)) return 'cet4';
            return '';
        }

        function buildRecordTags(rec, modeStr) {
            const mode = rec.mode === 'translation' ? 'translation' : 'writing';
            const levelMap = { cet4: '四级', cet6: '六级', tem4: '专四', tem8: '专八' };
            const level = detectExamLevel(rec);

            let html = `<span class="rec-tag rec-tag-${mode}">${modeStr}</span>`;
            if (level) {
                html += `<span class="rec-tag rec-tag-level">${levelMap[level]}</span>`;
            } else {
                html += `<span class="rec-tag rec-tag-level unknown">难度未记录</span>`;
            }
            html += rec.is_assigned
                ? `<span class="rec-tag rec-tag-assigned">🎯 老师布置</span>`
                : `<span class="rec-tag rec-tag-free">自由练习</span>`;
            return html;
        }

        function closeSingleRecordModal() {
            document.getElementById('single-record-modal').style.display = 'none';
        }

    </script>
